name: cd
on:
  push:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Build frontend (prod)
        if: github.ref == 'refs/heads/main'
        run: deno run bundle --minify --sourcemap
        env:
          BACKEND_URL: ${{ secrets.DEPLOY_BACKEND_URL }}
      - uses: hynek/setup-cached-uv@v2
        if: github.ref != 'refs/heads/main'
      - uses: awalsh128/cache-apt-pkgs-action@latest
        if: github.ref != 'refs/heads/main'
        with:
          packages: exiftool
          version: 1.0
      - name: Populate backend (dev)
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir ../frontend/dist
          uv run main sync src/photosite_backend/tests/test_data ../frontend/dist/
        working-directory: ./backend
      - name: Build frontend (dev)
        if: github.ref != 'refs/heads/main'
        run: deno run bundle --sourcemap
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=photosite
